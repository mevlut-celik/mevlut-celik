name: Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/main.yml]

permissions:
  contents: write

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Monochrome palettes to match the header; first dot color is "no contributions"
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f0f10&color_dots=#ebedf0,#c4c4ca,#929299,#56565c,#0f0f10
            dist/github-snake-dark.svg?color_snake=#ececec&color_dots=#161b22,#3a3a40,#6b6b72,#a8a8ae,#ececec

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
